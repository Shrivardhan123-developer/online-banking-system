<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BankFlow - Register</title>

    <link rel="stylesheet"
          href="login.css">

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">

                <span>🏦</span>

                <h1>BankFlow</h1>

            </div>

            <p class="subtitle">
                Create your customer account
            </p>


            <div class="form-group">

                <label for="fullName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                >

            </div>


            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="text"
                    id="phone"
                    placeholder="Enter your phone number"
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                >

            </div>


            <button
                id="registerButton"
                onclick="registerCustomer()">

                Create Account

            </button>


            <div id="registerMessage">
            </div>


            <p class="register-text">

                Already have an account?

                <a href="/login.html">
                    Login
                </a>

            </p>

        </div>

    </div>


    <script src="/register.js"></script>

</body>

</html>
