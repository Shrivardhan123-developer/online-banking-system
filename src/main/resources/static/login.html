<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BankFlow - Login</title>

    <link rel="stylesheet"
          href="login.css">

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">

                <span>🏦</span>

                <h1>BankFlow</h1>

            </div>

            <p class="subtitle">
                Secure Online Banking
            </p>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                >

            </div>


            <button
                id="loginButton"
                onclick="login()">

                Login

            </button>


            <div id="loginMessage">
            </div>


            <p class="register-text">

                Don't have an account?

                <a href="/register.html">
                    Create Account
                </a>

            </p>

        </div>

    </div>


    <script src="/login.js"></script>

</body>

</html>
